name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_MOCKING: enabled

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit & component tests (coverage ≥ 80%)
        run: pnpm --filter @triyuai/web test:coverage
      - name: Dependency audit (informational)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: apps/web/coverage
          retention-days: 7

  api:
    name: API tests (Vitest + Supertest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: triyu
          POSTGRES_PASSWORD: triyu
          POSTGRES_DB: triyuai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triyu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://triyu:triyu@localhost:5432/triyuai
      TEST_DATABASE_URL: postgresql://triyu:triyu@localhost:5432/triyuai
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to Postgres
        run: pnpm --filter @triyuai/api db:migrate
      - name: Unit, contract and integration tests (coverage ≥ 80%)
        run: pnpm --filter @triyuai/api test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  e2e:
    name: E2E · Accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @triyuai/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @triyuai/web exec playwright install --with-deps chromium
      - run: pnpm --filter @triyuai/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @triyuai/web build
      - name: Lighthouse (mobile) on home and coin page
        working-directory: apps/web
        run: pnpm exec lhci autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/lhci-report
          retention-days: 7
